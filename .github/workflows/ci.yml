name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No deployment secrets exist in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dml_lms_test
          MYSQL_USER: dml
          MYSQL_PASSWORD: dml-ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: '3306'
      DB_TEST_DATABASE: dml_lms_test
      DB_TEST_USERNAME: dml
      DB_TEST_PASSWORD: dml-ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl, iconv, fileinfo, zip, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Require a committed lockfile
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is missing. Run the 'Generate composer.lock' workflow once, then merge its branch."
            exit 1
          fi

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dependency vulnerability audit
        run: composer audit --no-interaction

      - name: PHP syntax
        run: find app bin database public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Code style (PSR-12)
        run: vendor/bin/phpcs -q

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrations apply cleanly to an empty database
        env:
          APP_KEY: ci-only-key-not-secret-0123456789abcdef
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: dml_lms_test
          DB_USERNAME: dml
          DB_PASSWORD: dml-ci
        run: php bin/console migrate && php bin/console migrate

      - name: Tests (unit, feature, security / tenant isolation)
        run: vendor/bin/phpunit

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning deploy/server/dml-backup deploy/server/dml-restore deploy/server/dml-deploy deploy/server/dml-deploy-gate deploy/server/*.sh tests/deploy/*.sh

      - name: Backup and restore rehearsal (PRD Phase 0 exit gate)
        env:
          APP_KEY: ci-only-key-not-secret-0123456789abcdef
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: dml_lms_rehearsal_source
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          export STORAGE_PATH="$RUNNER_TEMP/storage"
          printf '[client]\nuser=root\npassword=root\nhost=127.0.0.1\n' > "$RUNNER_TEMP/root.cnf"
          mysql --defaults-extra-file="$RUNNER_TEMP/root.cnf" -e "CREATE DATABASE dml_lms_rehearsal_source"
          php bin/console migrate
          php bin/console tenant:create demo "Demo School" demo.test
          echo 'rehearsal-password-123' | php bin/console user:create demo teacher@demo.test "Teacher" educator
          php bin/console seed:demo demo
          php bin/console course:import demo linux-server-administration --publish
          sudo MYSQL_DEFAULTS="$RUNNER_TEMP/root.cnf" bash tests/deploy/backup-restore-rehearsal.sh dml_lms_rehearsal_source

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

  frontend-budget:
    name: Asset budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Core shell stays under 150 KB compressed (PRD 8.2)
        run: |
          total=$(cat public/assets/app.css public/assets/app.js | gzip -9 | wc -c)
          echo "Compressed CSS+JS: ${total} bytes"
          test "$total" -lt 153600
