; Dedicated PHP-FPM pool so the LMS is isolated from the other sites on the server.
; Install as /etc/php/8.3/fpm/pool.d/dml-lms.conf (adjust version), then reload php-fpm.
[dml-lms]
user = dmllms
group = dmllms
listen = /run/php/dml-lms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; Size from measured memory: max_children ≈ (RAM reserved for the LMS) / (avg worker RSS).
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 60s

; Code is readable, not writable, by this user. Only shared/storage is writable.
php_admin_value[open_basedir] = /var/www/dml-lms/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/www/dml-lms/shared/storage/logs/php-error.log
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 21M
php_admin_value[session.save_path] = /var/www/dml-lms/shared/storage/sessions
php_admin_flag[opcache.enable] = On
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
