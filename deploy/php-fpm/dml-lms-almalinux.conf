; Dedicated PHP-FPM pool for the DML LMS on AlmaLinux (/etc/php-fpm.d/dml-lms.conf).
; Runs as its own user so it cannot touch the other sites' files.
[dml-lms]
user = dmllms
group = dmllms
listen = /run/php-fpm/dml-lms.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000
; Uploads on slow connections need time (a 200 MB video over mobile data can
; take many minutes), and so do full downloads of a recording. Ordinary pages
; finish in well under a second; video playback is sent in 4 MB pieces.
request_terminate_timeout = 1800s

php_admin_value[open_basedir] = /var/www/dml-lms/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/www/dml-lms/shared/storage/logs/php-error.log
; Files: UPLOAD_MAX_MB (10); video and audio: MEDIA_MAX_MB (200). Keep these
; a little above the larger one (ADR 0029).
php_admin_value[upload_max_filesize] = 210M
php_admin_value[post_max_size] = 215M
php_admin_value[max_input_time] = 1800
php_admin_flag[opcache.enable] = On
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
