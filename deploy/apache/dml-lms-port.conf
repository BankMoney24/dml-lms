# Temporary access on the server IP and its own port (no domain, plain HTTP).
# Installed by deploy/server/install-almalinux.sh as /etc/httpd/conf.d/dml-lms.conf.
# __PORT__ and __HOST__ are filled in by the installer. Remove once the domain is live.

Listen __PORT__

<VirtualHost *:__PORT__>
    ServerName __HOST__
    DocumentRoot /var/www/dml-lms/current/public

    # Covers both the "current" symlink path and the real releases/<id> path.
    <Directory /var/www/dml-lms>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Dedicated PHP-FPM pool. Same <FilesMatch><If> shape as the distro's global
    # php.conf so this (later-merged) vhost section wins over the shared www pool.
    <FilesMatch \.(php|phar)$>
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:unix:/run/php-fpm/dml-lms.sock|fcgi://dml-lms"
        </If>
    </FilesMatch>

    # Uploads: files up to 10 MB, video and audio up to 200 MB (ADR 0029), plus
    # the form. PHP and the app enforce the exact limits.
    LimitRequestBody 230686720

    ErrorLog /var/log/httpd/dml-lms-error.log
    CustomLog /var/log/httpd/dml-lms-access.log combined
</VirtualHost>
