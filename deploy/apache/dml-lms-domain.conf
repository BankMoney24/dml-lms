# The school's own domain (ADR 0019). Installed by deploy/server/setup-domain.sh as
# /etc/httpd/conf.d/dml-lms-domain.conf with __DOMAIN__ filled in. certbot then writes the
# HTTPS copy (dml-lms-domain-le-ssl.conf) and the HTTP→HTTPS redirect.
# www.__DOMAIN__ and other aliases are sent to https://__DOMAIN__ by the application
# (CANONICAL_REDIRECT), so every page has one address.

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__
    DocumentRoot /var/www/dml-lms/current/public

    <Directory /var/www/dml-lms>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.(php|phar)$>
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:unix:/run/php-fpm/dml-lms.sock|fcgi://dml-lms"
        </If>
    </FilesMatch>

    # Uploads: 3 files of up to 10 MB plus the form. PHP enforces the exact limits.
    LimitRequestBody 52428800
    # Do not advertise versions.
    ServerSignature Off

    ErrorLog /var/log/httpd/dml-lms-error.log
    CustomLog /var/log/httpd/dml-lms-access.log combined
</VirtualHost>
