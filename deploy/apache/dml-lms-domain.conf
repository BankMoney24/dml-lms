# Domain virtual host for when DNS for dmlschooloftechnology.com points at this server.
# Install as /etc/httpd/conf.d/dml-lms-domain.conf, then:
#   apachectl configtest && systemctl reload httpd
#   certbot --apache -d dmlschooloftechnology.com -d www.dmlschooloftechnology.com
# certbot writes the :443 copy (dml-lms-domain-le-ssl.conf) and adds the HTTPS redirect.

<VirtualHost *:80>
    ServerName dmlschooloftechnology.com
    ServerAlias www.dmlschooloftechnology.com
    DocumentRoot /var/www/dml-lms/current/public

    <Directory /var/www/dml-lms>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.(php|phar)$>
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:unix:/run/php-fpm/dml-lms.sock|fcgi://dml-lms"
        </If>
    </FilesMatch>

    # Uploads: 3 files of up to 10 MB plus the form. PHP enforces the exact limits.
    LimitRequestBody 52428800

    ErrorLog /var/log/httpd/dml-lms-error.log
    CustomLog /var/log/httpd/dml-lms-access.log combined
</VirtualHost>
