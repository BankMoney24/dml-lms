# Nginx site for the DML Learning Platform (non-cPanel servers).
# Install as /etc/nginx/sites-available/dml-lms.conf, symlink into sites-enabled,
# replace DOMAIN, then: nginx -t && systemctl reload nginx
# It only answers for DOMAIN, so the other sites on this server are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    if ($host = www.DOMAIN) { return 301 https://DOMAIN$request_uri; }

    # $realpath_root resolves the "current" symlink per request, so a release
    # switch takes effect immediately and atomically.
    root /var/www/dml-lms/current/public;
    index index.php;

    client_max_body_size 50m;   # 3 files of up to 10 MB plus the form
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/dml-lms.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Only the front controller executes; any other .php or dotfile is refused.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
