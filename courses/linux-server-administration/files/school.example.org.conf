# Nginx site for one website, with PHP-FPM and HTTPS added later by certbot.
# AlmaLinux: /etc/nginx/conf.d/school.example.org.conf
# Ubuntu:    /etc/nginx/sites-available/school.example.org
#            then: sudo ln -s ../sites-available/school.example.org /etc/nginx/sites-enabled/
# Test and reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name school.example.org www.school.example.org;

    root /var/www/school.example.org/public;
    index index.php index.html;

    access_log /var/log/nginx/school.access.log;
    error_log  /var/log/nginx/school.error.log;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # AlmaLinux:
        fastcgi_pass unix:/run/php-fpm/www.sock;
        # Ubuntu (adjust the version):
        # fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Never serve hidden files such as .env or .git
    location ~ /\. {
        deny all;
    }
}
