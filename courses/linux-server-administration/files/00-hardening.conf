# /etc/ssh/sshd_config.d/00-hardening.conf
# SSH hardening from the course "Linux Server Administration".
# For most settings the FIRST value sshd reads wins, so this file is named 00-.
#
# BEFORE reloading sshd:
#   1. make sure your own account has a working SSH key;
#   2. make sure your account is in one of the AllowGroups below
#      (wheel on AlmaLinux, sudo on Ubuntu);
#   3. keep your current session open and test from a second one.
#
#   sudo sshd -t && sudo systemctl reload sshd     # Ubuntu: reload ssh

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowGroups wheel sudo sshusers
